<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECC PMG · ExplanationContext Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07090f; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 48px 24px; }
.canvas { width: 1100px; background: #07090f; }
svg { width: 100%; height: auto; color: #ffffff; }
:root { --font-mono: "Space Mono", monospace; }

text.t  { font-family: "Space Grotesk", sans-serif; font-size: 14px; fill: #dde2f0; }
text.ts { font-family: "Space Grotesk", sans-serif; font-size: 12px; fill: #8898b8; }
text.th { font-family: "Space Grotesk", sans-serif; font-size: 14px; font-weight: 600; fill: #dde2f0; }

rect.box { fill: #0d1117; stroke: rgba(255,255,255,0.1); }
line.arr, path.arr { stroke: #4a5570; stroke-width: 1.5; fill: none; }

.c-amber > rect  { fill: rgba(236,160,48,0.1); stroke: #eca030; }
.c-amber > text.th { fill: #f0c060; }
.c-amber > text.ts { fill: #eca030; }

.c-gray > rect   { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.2); }
.c-gray > text.th { fill: #c0c8d8; }
.c-gray > text.ts { fill: #8898b8; }

.c-purple > rect { fill: rgba(107,88,255,0.1); stroke: #6b58ff; }
.c-purple > text.th { fill: #a899ff; }
.c-purple > text.ts { fill: #8878ff; }

.c-teal > rect   { fill: rgba(15,156,122,0.1); stroke: #0f9c7a; }
.c-teal > text.th { fill: #5dcaa5; }
.c-teal > text.ts { fill: #3aaa8a; }

.c-coral > rect  { fill: rgba(224,80,80,0.1); stroke: #e06050; }
.c-coral > text.th { fill: #f09080; }
.c-coral > text.ts { fill: #e07060; }

.c-blue > rect   { fill: rgba(58,160,216,0.1); stroke: #3aa0d8; }
.c-blue > text.th { fill: #8acce8; }
.c-blue > text.ts { fill: #3aa0d8; }
</style>
</head>
