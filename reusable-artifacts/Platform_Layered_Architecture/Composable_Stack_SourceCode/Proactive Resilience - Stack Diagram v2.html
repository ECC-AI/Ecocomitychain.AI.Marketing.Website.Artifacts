<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proactive Resilience — Stack Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  /* ── Type & spacing scale ─────────────────────────────────────────── */
  :root {
    --type-title: 80px;
    --type-sub: 40px;
    --type-label: 30px;
    --type-cap: 20px;
    --type-tag: 18px;

    /* diagram geometry (tweakable) */
    --iso-x: 58deg;     /* isometric tilt */
    --gap: 126px;       /* vertical rhythm between layers */
    --tile: 280px;      /* tile square edge before rotation */
    --thick: 14px;      /* layer extrusion depth */

    --bg: #07060a;
    --ink: #f4f2f8;
    --ink-dim: #b9b4c7;
    --line: rgba(190,180,220,.5);
  }

  /* ── Palette sets (per-layer gradient stops) ──────────────────────── */
  [data-palette="spectrum"] {
    --p1a:#7C5CFF; --p1b:#B06BFF;
    --p2a:#F0428C; --p2b:#FF77AE;
    --p3a:#FF6A3D; --p3b:#FF9A4D;
    --p4a:#FFB23D; --p4b:#FFD566;
    --p5a:#1FC8C0; --p5b:#4DE6CE;
  }
  [data-palette="warm"] {
    --p1a:#FF8A3D; --p1b:#FFC24D;
    --p2a:#FF6A3D; --p2b:#FF9A6B;
    --p3a:#FF4D6D; --p3b:#FF8A9E;
    --p4a:#E84393; --p4b:#FF6FB0;
    --p5a:#C44DFF; --p5b:#E07AFF;
  }
  [data-palette="cool"] {
    --p1a:#5A7BFF; --p1b:#8FB6FF;
    --p2a:#4DA6FF; --p2b:#7FD8FF;
    --p3a:#1FC8C0; --p3b:#5BE6D2;
    --p4a:#6C5CE7; --p4b:#9B8CFF;
    --p5a:#00C2A8; --p5b:#4DEED0;
  }
  [data-palette="violet"] {
    --p1a:#9A7CFF; --p1b:#C39BFF;
    --p2a:#7C5CFF; --p2b:#A88BFF;
    --p3a:#6A4DF0; --p3b:#9277FF;
    --p4a:#5A3FD6; --p4b:#7C5CFF;
    --p5a:#4A33B8; --p5b:#6A4DF0;
  }

  .l1 { --from: var(--p1a); --to: var(--p1b); }
  .l2 { --from: var(--p2a); --to: var(--p2b); }
  .l3 { --from: var(--p3a); --to: var(--p3b); }
  .l4 { --from: var(--p4a); --to: var(--p4b); }
  .l5 { --from: var(--p5a); --to: var(--p5b); }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    font-family: "Space Grotesk", system-ui, sans-serif;
  }

  /* ── Stage / scaling ──────────────────────────────────────────────── */
  #viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #stage {
    width: 1920px; height: 1080px;
    transform-origin: center center;
    position: relative; flex: none;
  }

  .slide {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(124,92,255,.10), transparent 55%),
      radial-gradient(90% 70% at 50% 120%, rgba(31,200,192,.07), transparent 60%),
      var(--bg);
    overflow: hidden;
    color: var(--ink);
  }
  /* faint vignette */
  .slide::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 45%, transparent 60%, rgba(0,0,0,.55));
  }

  /* ── Header ───────────────────────────────────────────────────────── */
  .header {
    position: absolute; top: 64px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    z-index: 100; text-align: center;
  }
  .title-glow {
    position: absolute; top: -130px; left: 50%; transform: translateX(-50%);
    width: 1500px; height: 540px; border-radius: 50%;
    filter: blur(95px); opacity: .5; pointer-events: none; z-index: -1;
    background: conic-gradient(from 200deg,
      #7C5CFF, #F0428C, #FF6A3D, #FFB23D, #1FC8C0, #4DA6FF, #7C5CFF);
  }
  .tag {
    font-family: "Space Mono", monospace;
    font-size: var(--type-tag); letter-spacing: .26em; text-transform: uppercase;
    color: var(--ink-dim);
    padding: 8px 18px; border: 1px solid rgba(190,180,220,.28);
    border-radius: 999px; margin-bottom: 26px;
    background: rgba(255,255,255,.02);
  }
  .title {
    font-size: var(--type-title); font-weight: 700; line-height: .98;
    letter-spacing: -.02em; margin: 0;
  }
  .title .l-a { color: var(--ink); }
  .title .l-b { color: var(--ink-dim); font-weight: 500; font-size: 54px; }

  /* ── Diagram ──────────────────────────────────────────────────────── */
  .diagram {
    position: absolute; left: 50%; top: 652px;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column;
    align-items: center;
  }
  .layer-row {
    display: grid;
    grid-template-columns: 360px 480px 360px;
    align-items: center;
    height: var(--gap);
    position: relative;
  }

  /* left label */
  .lbl-l {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 26px; padding-right: 4px;
  }
  .lbl-title {
    font-size: var(--type-label); font-weight: 600; line-height: 1.08;
    text-align: right; color: var(--ink); max-width: 280px;
    text-wrap: balance;
  }
  .bracket {
    flex: none; width: 20px;
    height: calc(var(--gap) * 0.52);
    border: 2px solid var(--line);
    border-right: none;
    border-radius: 4px 0 0 4px;
  }

  /* tile */
  .tile-cell { position: relative; display: grid; place-items: center; }
  .tile-glow {
    position: absolute; left: 50%; top: 52%;
    width: 460px; height: 230px;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, var(--from), transparent 68%);
    filter: blur(50px); opacity: .42; pointer-events: none;
  }
  .tile {
    position: relative;
    width: var(--tile); height: var(--tile);
    transform-style: preserve-3d;
    transform: rotateX(var(--iso-x)) rotateZ(45deg);
  }
  .face {
    position: absolute; inset: 0;
    border-radius: 30px;
  }
  .face.top {
    background:
      linear-gradient(135deg,
        color-mix(in srgb, var(--from) 26%, transparent),
        color-mix(in srgb, var(--to) 9%, transparent)),
      radial-gradient(120% 120% at 30% 25%,
        color-mix(in srgb, var(--from) 20%, transparent), transparent 60%),
      rgba(10,9,16,.34);
    box-shadow:
      inset 0 0 0 1.4px color-mix(in srgb, var(--from) 78%, transparent),
      inset 0 0 70px color-mix(in srgb, var(--from) 16%, transparent),
      inset 0 1px 22px rgba(255,255,255,.10);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .face.under {
    transform: translateZ(calc(-1 * var(--thick)));
    background: rgba(8,7,12,.5);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--from) 30%, transparent);
  }

  /* right caption */
  .lbl-r {
    display: flex; align-items: center; gap: 0;
    padding-left: 4px;
  }
  .conn {
    flex: none; width: 150px; height: 1px;
    background: linear-gradient(90deg, rgba(190,180,220,.08), var(--line));
  }
  .dot {
    flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--from);
    box-shadow: 0 0 10px var(--from);
    margin: 0 16px 0 2px;
  }
  .cap {
    font-family: "Space Mono", monospace;
    font-size: var(--type-cap); font-style: italic;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-dim); line-height: 1.35; max-width: 230px;
  }

  #tweaks-root { position: fixed; inset: 0; pointer-events: none; z-index: 2147483646; }
  #tweaks-root > * { pointer-events: auto; }
</style>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div class="slide" data-palette="spectrum" data-screen-label="Stack diagram">
        <div class="header">
          <div class="title-glow"></div>
          <span class="tag">ECC · Risk Analytics</span>
          <h1 class="title">
            <span class="l-a">Proactive Resilience</span><br />
            <span class="l-b">ECC's Approach</span>
          </h1>
        </div>

        <div class="diagram">
          <div class="layer-row l1" style="z-index:50">
            <div class="lbl-l">
              <span class="lbl-title">Layer One</span>
              <span class="bracket"></span>
            </div>
            <div class="tile-cell">
              <div class="tile-glow"></div>
              <div class="tile">
                <div class="face under"></div>
                <div class="face top"></div>
              </div>
            </div>
            <div class="lbl-r">
              <span class="conn"></span>
              <span class="dot"></span>
              <span class="cap">Short description</span>
            </div>
          </div>

          <div class="layer-row l2" style="z-index:40">
            <div class="lbl-l">
              <span class="lbl-title">Layer Two</span>
              <span class="bracket"></span>
            </div>
            <div class="tile-cell">
              <div class="tile-glow"></div>
              <div class="tile">
                <div class="face under"></div>
                <div class="face top"></div>
              </div>
            </div>
            <div class="lbl-r">
              <span class="conn"></span>
              <span class="dot"></span>
              <span class="cap">Short description</span>
            </div>
          </div>

          <div class="layer-row l3" style="z-index:30">
            <div class="lbl-l">
              <span class="lbl-title">Layer Three</span>
              <span class="bracket"></span>
            </div>
            <div class="tile-cell">
              <div class="tile-glow"></div>
              <div class="tile">
                <div class="face under"></div>
                <div class="face top"></div>
              </div>
            </div>
            <div class="lbl-r">
              <span class="conn"></span>
              <span class="dot"></span>
              <span class="cap">Short description</span>
            </div>
          </div>

          <div class="layer-row l4" style="z-index:20">
            <div class="lbl-l">
              <span class="lbl-title">Layer Four</span>
              <span class="bracket"></span>
            </div>
            <div class="tile-cell">
              <div class="tile-glow"></div>
              <div class="tile">
                <div class="face under"></div>
                <div class="face top"></div>
              </div>
            </div>
            <div class="lbl-r">
              <span class="conn"></span>
              <span class="dot"></span>
              <span class="cap">Short description</span>
            </div>
          </div>

          <div class="layer-row l5" style="z-index:10">
            <div class="lbl-l">
              <span class="lbl-title">Layer Five</span>
              <span class="bracket"></span>
            </div>
            <div class="tile-cell">
              <div class="tile-glow"></div>
              <div class="tile">
                <div class="face under"></div>
                <div class="face top"></div>
              </div>
            </div>
            <div class="lbl-r">
              <span class="conn"></span>
              <span class="dot"></span>
              <span class="cap">Short description</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tweaks-root"></div>

  <!-- Stage scaling -->
  <script>
    (function () {
      var stage = document.getElementById('stage');
      function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>

  <!-- React + Babel for Tweaks -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
